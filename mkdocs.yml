site_name: commerce-agent-skills
site_description: Agent Skills and rules for AI coding agents building e-commerce and marketplace products.
site_author: Naser Sadrmanesh
site_url: https://sadrmanesh.github.io/commerce-agent-skills/
repo_url: https://github.com/sadrmanesh/commerce-agent-skills
repo_name: sadrmanesh/commerce-agent-skills
edit_uri: ""

# The site source is generated. Run `node scripts/build-docs.mjs`, then
# `mkdocs build --strict -f build/mkdocs.yml`. See docs/github-pages.md.
copyright: Copyright &copy; 2026 Naser Sadrmanesh

theme:
  name: material
  language: en
  icon:
    logo: material/cart-outline
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link
    - toc.follow
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: amber
      toggle:
        icon: material/brightness-auto
        name: Switch to system preference

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/sadrmanesh
    - icon: material/web
      link: https://sadrmanesh.github.io/

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

