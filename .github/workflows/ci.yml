name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate skills
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate skill frontmatter and structure
        run: node scripts/validate-skills.mjs

      - name: Check the generated README catalog
        run: node scripts/generate-catalog.mjs --check

      - name: Build the docs site
        run: node scripts/build-docs.mjs --out site

      - name: Run tests
        run: node --test
