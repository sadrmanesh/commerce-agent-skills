name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate skills
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate skill frontmatter and structure
        run: node scripts/validate-skills.mjs

      - name: Check the generated README catalog
        run: node scripts/generate-catalog.mjs --check

      - name: Score the worked examples
        run: node scripts/run-evals.mjs

      - name: Run tests
        run: node --test

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    env:
      NO_MKDOCS_2_WARNING: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install MkDocs
        run: pip install -r requirements-docs.txt

      - name: Generate the site source
        run: node scripts/build-docs.mjs

      - name: Build the docs site
        run: mkdocs build --strict -f build/mkdocs.yml
