name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to tag. Must match package.json, for example 0.2.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Tag release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the requested version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: node --input-type=module -e "import { readFileSync } from 'node:fs'; const version = process.env.REQUESTED_VERSION; if (!/^[0-9]+\\.[0-9]+\\.[0-9]+$/.test(version)) { console.error('Version must look like 0.2.0'); process.exit(1); } const pkg = JSON.parse(readFileSync('package.json', 'utf8')).version; if (pkg !== version) { console.error('package.json is ' + pkg); process.exit(1); }"

      - name: Validate skills and tests
        run: |
          node scripts/validate-skills.mjs
          node scripts/generate-catalog.mjs --check
          node --test
          node scripts/build-docs.mjs --out site

      - name: Tag and create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="$REQUESTED_VERSION"
          git fetch origin --tags
          if git rev-parse "refs/tags/v${version}" >/dev/null 2>&1; then
            echo "Tag v${version} already exists"
            exit 1
          fi
          git config user.name "Naser Sadrmanesh"
          git config user.email "info.sadrmanesh@gmail.com"
          git tag -a "v${version}" -m "v${version}"
          git push origin "v${version}"
          gh release create "v${version}" --title "v${version}" --notes "See CHANGELOG.md for ${version}."
