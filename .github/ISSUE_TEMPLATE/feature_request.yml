name: Feature request
description: Propose a skill, rule, or checker for a later release.
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Which e-commerce task can an agent not do well with the current skills?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed scope
      description: What the skill should cover, and what it should leave to an existing skill.
    validations:
      required: true
